[project]
name = "job-scout"
version = "2.4.1"
description = "Automated job search for the Dutch market, scored against your CV by an LLM and filtered by real commute time"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jeroen van Wageningen" }]
maintainers = [{ name = "Jeroen van Wageningen" }]
keywords = [
    "job-search",
    "job-board",
    "vacancy",
    "netherlands",
    "llm",
    "automation",
    "self-hosted",
    "cv",
    "commute",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Dutch",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "python-jobspy>=0.1.0",
    "openrouteservice>=2.3.3",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pypdf2>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "jobspy>=0.31.0",
    "pytest>=9.0.2",
    "openai>=2.34.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.0",
    "reportlab>=5.0.0",
    "mcp>=1.28.1",
    "segno>=1.6.6",
    "pillow>=11.4.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
job-scout = "job_scout.cli:main"

[project.urls]
Homepage = "https://github.com/JvWageningen/job-scout"
Repository = "https://github.com/JvWageningen/job-scout"
Documentation = "https://github.com/JvWageningen/job-scout/blob/main/docs/README.md"
Issues = "https://github.com/JvWageningen/job-scout/issues"
Changelog = "https://github.com/JvWageningen/job-scout/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/JvWageningen"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}\n\n[skip ci]"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --tb=short"

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["job_scout.cli"]
# Click decorators are untyped in strict mode; this is expected
disable_error_code = ["untyped-decorator", "misc"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.vulture]
min_confidence = 80
paths = ["src/"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.33.0.20260327",
    "ruff>=0.15.6",
    "bandit>=1.8.0",
    "vulture>=2.14",
    "radon>=6.0.1",
    "pip-audit>=2.7.3",
    "pre-commit>=4.0",
    "pymupdf>=1.26.0",
]
